version: '3.8'

services:
  postgres:
    restart: always

  redis:
    restart: always

  qdrant:
    restart: always

  backend:
    restart: always
    volumes: []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - APP_ENV=production

  worker:
    restart: always
    volumes: []
    environment:
      - APP_ENV=production

  frontend:
    restart: always
    volumes: []
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
